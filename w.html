<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Widget</title>
<style>html,body{height:100%;margin:0;background:transparent}</style>
</head>
<body>
<script src="./engine.js"></script>
<script>

/* ---------- Loader: baut das Widget aus den Parametern der Adresse ---------- */
(function(){
  var q = new URLSearchParams(location.search);
  var fkeys = Object.keys(FONTS);
  var bgModes = ['Farbe','Verlauf','Transparent','Nur Rahmen'];
  var wkey = q.get('w') || 'uhr';
  var W = WIDGETS[wkey] || WIDGETS.uhr;
  var cfg = {
    font:  fkeys[parseInt(q.get('f'),10)] || fkeys[0],
    bgMode: bgModes[parseInt(q.get('bgm'),10)] || 'Verlauf',
    bg:    '#' + (q.get('bg') || 'fff0f6'),
    accent:'#' + (q.get('ac') || 'e8629a'),
    text:  '#' + (q.get('tx') || '4a2b38'),
    radius: q.has('r') ? +q.get('r') : 18,
    pad:    q.has('p') ? +q.get('p') : 10,
    scale:  q.has('s') ? +q.get('s') : 100,
    dash:   q.get('d') === '1',
    shadow: q.get('sh') !== '0',
    cs:     CSMODES[parseInt(q.get('cs'),10)] || 'Hell',
    umfT:   q.get('ut') !== '0',
    umf:    '#' + (q.get('uf') || 'ffffff')
  };
  cfg.variant = q.get('v') || W.variants[0].k;
  W.fields.forEach(function(fl){
    var raw = q.get(fl.k);
    if (raw === null) { cfg[fl.k] = fl.def; return; }
    if (fl.t === 'bool')   cfg[fl.k] = (raw === '1' || raw === 'true');
    else if (fl.t === 'number') cfg[fl.k] = +raw;
    else cfg[fl.k] = raw;
  });
  var html;
  try { html = W.build(cfg); }
  catch (e) {
    html = '<!doctype html><meta charset="utf-8"><body style="font:15px system-ui;padding:16px;color:#4a2b38">'
         + 'Dieses Widget konnte nicht aufgebaut werden. Bitte die Adresse im Widget-Baukasten neu erzeugen.</body>';
  }
  document.open(); document.write(html); document.close();
})();

</script>
</body>
</html>
